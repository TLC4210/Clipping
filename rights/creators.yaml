# CLIP ALLOWLIST: creators whose footage the bot may clip, and under what rules.
# Researched 2026-11-12. Campaigns change weekly, so re-verify before relying on an entry.
#
# How the bot uses this file:
#   - It only fetches from a creator when `status: active` AND `joined: true` AND today is
#     within `valid_until`. A campaign's permission covers only clippers who have JOINED it,
#     so every entry starts at joined: false. Flip it after you join on Content Rewards.
#   - It searches each creator's YouTube uploads (`youtube.channel_id`), limited by `source`.
#   - `caption_must_include` is added to every post caption and checked in QA.
#   - `focus` is passed to the AI picker ("X must be the main focus").
#   - `auto_publish: false` means clips are made but never posted without you (pre-approval,
#     logo overlays, Twitch-only sources, etc.).
#   - Anything under `blocked:` is never fetched, even if it shows up as CC.
#
# basis values: campaign (paid program; joining = permission), public_statement, written_permission

creators:

  # ───────────────────────── STREAMS niche (FaZe alumni / CORE) ─────────────────────────
  lacy:
    name: Lacy
    niches: [streams]
    youtube: {channel_id: UCeoZXkaJDtdTHafgoZeDcAA, handle: "@LacyHimself"}   # Live tab = full streams
    twitch: lacy
    basis: campaign
    status: active
    joined: false
    valid_until: 2026-11-22          # 30-day campaign launched ~Oct 20-23; confirm end date on listing
    campaign:
      name: "$30,000 Lacy 30 Day Campaign"
      operator: Reach (Content Rewards)
      pay: "Pool split by share of approved views: $25,000 (TikTok/Reels/Shorts) + $5,000 (X). 10% CR fee."
      minimum: "1,000,000 approved views across your clips before you get any share"
      urls:
        - https://contentrewards.com/c/campaigns/4479e5e2-9a00-489e-8b0c-345834f37cc7
        - https://contentrewards.com/c/campaigns/20b7c977-8d0c-4bd0-b9b0-2db9200f405b
      rules_url: https://reachclipping.com/Lacy
    source: {any_date: true}         # any Lacy video/stream from Twitch, YouTube, Snapchat, TikTok, IG, X
    focus: "Lacy must be the primary focus of the clip (not just an intro cameo)"
    caption_must_include: ["Lacy", "#Lacy"]
    rules:
      - "Lacy's name in caption or on-screen text; #Lacy in caption"
      - "≥50% of account audience in US/CA/UK/AU/NZ"
      - "No logos of any kind; no negative portrayal / hate farming"
      - "No botting, reposts, or collab posts; no repetitive or mismatched thumbnails"
      - "Submit each clip link within 30 minutes of posting"
      - "AI-generated content: rules page CONFLICTS (allowed in one section, a strike offense in another). Don't use AI voice/visuals; ask Reach in Discord."
      - "Reach recommends a dedicated Lacy clip account (or an existing relevant page with 100+ followers)"
    auto_publish: true
    verified_on: 2026-11-12
    evidence:
      - https://reachclipping.com/Lacy
      - https://www.clyper.io/clipping-programs/lacy
      - https://x.com/LacyHimself/status/1758167310999671133

