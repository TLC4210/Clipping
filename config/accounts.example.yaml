# Copy to config/accounts.yaml (git-ignored) and fill in after you create the accounts.
# One niche -> exactly one YouTube channel and one Instagram account.
# A clip is published to at most ONE account per platform (enforced in the database).

accounts:
  gta:
    youtube:
      enabled: false
      channel_id: ""                         # UC...
      oauth_client_secret: secrets/google_client_secret.json
      token_file: secrets/yt_gta_token.json  # created by `clipper auth-youtube --niche gta`
      privacy: private                       # start private; switch to public once you've checked output
      category_id: "20"                      # 20 = Gaming
    instagram:
      enabled: false
      ig_user_id: ""                         # Instagram professional account ID
      access_token_file: secrets/ig_gta_token.txt
      api_host: graph.instagram.com          # Instagram Login. Use graph.facebook.com for Facebook Login.
      api_version: v24.0
      # Meta must fetch the video from a public URL. Easiest: set gcs_bucket and the bot uploads
      # each clip to that public Google Cloud Storage bucket, posts it, then deletes it.
      gcs_bucket: ""                         # e.g. clipper-clips-abc123
      gcs_credentials: secrets/gcs_key.json  # service-account key; blank = gcloud default login
      # Manual alternative: a URL prefix where you sync rendered files yourself.
      public_base_url: ""
      share_to_feed: true
  minecraft:
    youtube:
      enabled: false
      channel_id: ""
      oauth_client_secret: secrets/google_client_secret.json
      token_file: secrets/yt_minecraft_token.json
      privacy: private
      category_id: "20"
    instagram:
      enabled: false
      ig_user_id: ""
      access_token_file: secrets/ig_minecraft_token.txt
      api_host: graph.instagram.com
      api_version: v24.0
      gcs_bucket: ""
      gcs_credentials: secrets/gcs_key.json
      public_base_url: ""
      share_to_feed: true
  streams:                                   # FaZe alumni / CORE / streamer campaigns (rights/creators.yaml)
    youtube:
      enabled: false
      channel_id: ""
      oauth_client_secret: secrets/google_client_secret.json
      token_file: secrets/yt_streams_token.json
      privacy: private
      category_id: "20"
    instagram:
      enabled: false
      ig_user_id: ""
      access_token_file: secrets/ig_streams_token.txt
      api_host: graph.instagram.com
      api_version: v24.0
      gcs_bucket: ""
      gcs_credentials: secrets/gcs_key.json
      public_base_url: ""
      share_to_feed: true
